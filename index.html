<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>STORY MENU</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:none}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;
transition:opacity .35s ease;transform-origin:center center;user-select:none;
-webkit-user-drag:none;pointer-events:none}
.slide.active{opacity:1}
#mark{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;
font:600 30px/1 sans-serif;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#mark.show{opacity:1}
</style>
</head>

<body>

<div id="stage"></div>
<div id="mark">Ⅱ</div>

<script>
(async function(){

  const stage=document.getElementById("stage");
  const mark=document.getElementById("mark");

  // menu1.jpg ～ menu15.jpg
  const candidates=Array.from(
    {length:15},
    (_,i)=>`menu${i+1}.jpg`
  );

  const available=[];

  function exists(src){
    return new Promise(resolve=>{
      const im=new Image();

      im.onload=()=>resolve(src);
      im.onerror=()=>resolve(null);

      // キャッシュを使わず最新画像を確認
      im.src=src+"?v="+Date.now();
    });
  }

  const checked=await Promise.all(
    candidates.map(exists)
  );

  checked.filter(Boolean).forEach(src=>{

    const im=document.createElement("img");

    // 最新画像を取得
    im.src=src+"?v="+Date.now();
    im.dataset.src=src;
    im.className="slide";

    stage.appendChild(im);
    available.push(im);
  });

  if(!available.length){

    document.body.innerHTML=
      '<div style="color:#fff;padding:24px;font:20px sans-serif">' +
      'menu1.jpg〜menu15.jpg が見つかりません。' +
      '</div>';

    return;
  }

  available[0].classList.add("active");

  let current=0;
  let paused=false;
  let timer=null;

  let scale=1;
  let panX=0;
  let panY=0;

  let startX=0;
  let startY=0;
  let lastX=0;
  let lastY=0;
  let moved=false;

  let pinchDistance=0;
  let pinchScale=1;

  // 6秒
  const INTERVAL=6000;

  function active(){
    return available[current];
  }

  function resetTransform(){

    scale=1;
    panX=0;
    panY=0;

    available.forEach(x=>{
      x.style.transform=
        "translate(0px,0px) scale(1)";
    });
  }

  function apply(){

    active().style.transform=
      `translate(${panX}px,${panY}px) scale(${scale})`;
  }

  function show(i){

    active().classList.remove("active");

    current=
