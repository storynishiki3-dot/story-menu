<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>STORY FULL MENU</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:none}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;
transition:opacity .35s ease;transform-origin:center center;user-select:none;
-webkit-user-drag:none;pointer-events:none}
.slide.active{opacity:1}
#mark{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;
font:600 30px/1 sans-serif;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#mark.show{opacity:1}
</style>
</head>
<body>
<div id="stage"></div><div id="mark">Ⅱ</div>
<script>
(function(){
  const files=Array.from({length:9},(_,i)=>`detail${i+1}.jpg`);
  const stage=document.getElementById("stage"),mark=document.getElementById("mark");
  const slides=[];
  files.forEach((src,i)=>{
    const im=document.createElement("img");
    im.src=src; im.className="slide"+(i===0?" active":"");
    stage.appendChild(im); slides.push(im);
  });

  let current=0,paused=false,timer=null;
  let scale=1,panX=0,panY=0,startX=0,startY=0,lastX=0,lastY=0,moved=false;
  let pinchDistance=0,pinchScale=1,lastTap=0,tapTimer=null;
  const INTERVAL=7000;

  function active(){return slides[current]}
  function reset(){scale=1;panX=0;panY=0;slides.forEach(x=>x.style.transform="translate(0px,0px) scale(1)")}
  function apply(){active().style.transform=`translate(${panX}px,${panY}px) scale(${scale})`}
  function show(i){active().classList.remove("active");current=(i+slides.length)%slides.length;active().classList.add("active");reset()}
  function next(){show(current+1)} function prev(){show(current-1)}
  function startAuto(){clearInterval(timer);if(!paused)timer=setInterval(next,INTERVAL)}
  function flash(t){mark.textContent=t;mark.classList.add("show");setTimeout(()=>mark.classList.remove("show"),550)}
  function toggle(){paused=!paused;if(paused){clearInterval(timer);flash("Ⅱ")}else{flash("▶");startAuto()}}
  function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}

  stage.addEventListener("touchstart",e=>{
    if(e.touches.length===2){clearInterval(timer);pinchDistance=dist(e.touches[0],e.touches[1]);pinchScale=scale;return}
    if(e.touches.length===1){const t=e.touches[0];startX=lastX=t.clientX;startY=lastY=t.clientY;moved=false}
  },{passive:false});

  stage.addEventListener("touchmove",e=>{
    e.preventDefault();
    if(e.touches.length===2){
      const d=dist(e.touches[0],e.touches[1]);
      scale=Math.max(1,Math.min(4,pinchScale*d/pinchDistance));
      if(scale===1){panX=0;panY=0} apply(); return;
    }
    if(e.touches.length===1){
      const t=e.touches[0],dx=t.clientX-startX,dy=t.clientY-startY;
      if(Math.abs(dx)>8||Math.abs(dy)>8)moved=true;
      if(scale>1){panX+=t.clientX-lastX;panY+=t.clientY-lastY;apply()}
      lastX=t.clientX;lastY=t.clientY;
    }
  },{passive:false});

  stage.addEventListener("touchend",e=>{
    if(e.touches.length>0)return;
    const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;
    if(scale===1&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){
      if(dx<0)next();else prev();startAuto();return;
    }
    if(moved||scale>1){startAuto();return}
    const now=Date.now();
    if(now-lastTap<320){
      clearTimeout(tapTimer);lastTap=0;location.href="index.html";
    }else{
      lastTap=now;tapTimer=setTimeout(()=>{toggle();lastTap=0},330);
    }
  },{passive:false});
  startAuto();
})();
</script>
</body>
</html>
